[package]
name = "gtfs-guru"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Command-line interface for GTFS Guru validator"
repository = "https://github.com/abasis-ltd/gtfs.guru"
homepage = "https://github.com/abasis-ltd/gtfs.guru"
readme = "README.md"
keywords = ["gtfs", "transit", "validator", "cli"]
categories = ["command-line-utilities"]
[[bin]]
name = "gtfs-guru"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
indicatif = "0.18.3"

[dependencies.gtfs-guru-core]
path = "../gtfs_validator_core"
version = "1.0.0"

[dependencies.gtfs-guru-report]
path = "../gtfs_validator_report"
version = "1.0.0"

[dependencies.gtfs-guru-profile]
path = "../gtfs_validator_profile"
version = "1.0.0"
