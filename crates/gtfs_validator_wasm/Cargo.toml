[package]
name = "gtfs-guru-wasm"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "GTFS validator compiled to WebAssembly for browser-based validation"
repository = "https://github.com/abasis-ltd/gtfs.guru"
homepage = "https://github.com/abasis-ltd/gtfs.guru"

[package.metadata.wasm-pack.profile.release]
# Disable built-in wasm-opt (we'll run it separately with proper flags)
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
threads = [
    "dep:wasm-bindgen-rayon",
    "dep:parking_lot_core",
    "wasm-bindgen-rayon/no-bundler",
    "gtfs-guru-core/parallel",
]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = "0.3"
chrono = { workspace = true }

# Optional: better panic messages in browser console
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }
# DashMap/parking_lot contention inside parallel validators must use the wasm
# atomic parker. Its fallback parker can panic and strand a Rayon join.
parking_lot_core = { version = "0.9", features = ["nightly"], optional = true }

[dependencies.gtfs-guru-core]
path = "../gtfs_validator_core"
version = "1.0.0"
default-features = false  # Disable rayon for WASM

[dependencies.gtfs-guru-report]
path = "../gtfs_validator_report"
version = "1.0.0"
default-features = false

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = { workspace = true }
