server {
    listen 80;
    server_name localhost;

    # Required for SharedArrayBuffer and multi-threaded WebAssembly.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Keep deployment/configuration files out of the public web root.
    location ~* ^/(nginx\.conf|Dockerfile|\.env|docker-compose\.ya?ml)$ {
        return 404;
    }

    # Fetching and SSRF enforcement live in the Rust service.
    location = /cors-proxy {
        proxy_pass http://gtfs-validator:3000;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 10s;
    }

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
