name: Rust

on:
  workflow_call:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev clang libclang-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  wasm:
    name: WASM Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-wasm-pack

      - name: Install binaryen (wasm-opt)
        env:
          BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
          BINARYEN_VERSION: '131'
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o "$archive"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build all WASM packages through the production script
        run: ./scripts/build-wasm.sh

      - name: Run WASM tests
        run: wasm-pack test --node crates/gtfs_validator_wasm

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Chromium for the WASM browser smoke test
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test threaded and fallback WASM runtimes in Chromium
        run: npm run test:wasm-browser

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: |
            crates/gtfs_validator_wasm/pkg/
            crates/gtfs_validator_wasm/pkg-mt/
