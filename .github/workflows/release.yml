name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate and build (does not publish without a tag)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and package versions
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/check-release-version.py --tag "$RELEASE_VERSION"

  build-and-release:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build CLI (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release -p gtfs-guru
          cargo build --release -p gtfs-guru --target x86_64-unknown-linux-musl
          cargo build --release -p gtfs-guru --target aarch64-unknown-linux-gnu

          mkdir -p dist
          tar -C target/release -czf dist/gtfs-guru-linux-x86_64.tar.gz gtfs-guru
          tar -C target/x86_64-unknown-linux-musl/release -czf dist/gtfs-guru-linux-x86_64-musl.tar.gz gtfs-guru
          tar -C target/aarch64-unknown-linux-gnu/release -czf dist/gtfs-guru-linux-aarch64.tar.gz gtfs-guru
          cp dist/gtfs-guru-linux-x86_64-musl.tar.gz dist/gtfs-guru-linux-x86_64-static.tar.gz

      - name: Build CLI (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release -p gtfs-guru --target x86_64-apple-darwin
          cargo build --release -p gtfs-guru --target aarch64-apple-darwin

          mkdir -p dist
          tar -C target/x86_64-apple-darwin/release -czf dist/gtfs-guru-macos-x86_64.tar.gz gtfs-guru
          tar -C target/aarch64-apple-darwin/release -czf dist/gtfs-guru-macos-arm64.tar.gz gtfs-guru
          lipo -create -output dist/gtfs-guru \
            target/x86_64-apple-darwin/release/gtfs-guru \
            target/aarch64-apple-darwin/release/gtfs-guru
          tar -C dist -czf dist/gtfs-guru-macos-universal.tar.gz gtfs-guru
          rm -f dist/gtfs-guru

      - name: Build CLI (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cargo build --release -p gtfs-guru
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path target\\release\\gtfs-guru.exe -Destination dist\\gtfs-guru.exe -Force
          Compress-Archive -Path dist\\gtfs-guru.exe -DestinationPath dist\\gtfs-guru-windows-x64.zip -Force

      - name: Upload CLI artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload CLI artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: cli-macos
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload CLI artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Apple certificate (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # Decode certificate using OpenSSL (more robust)
          echo "$APPLE_CERTIFICATE" | openssl base64 -d -A -out $RUNNER_TEMP/certificate.p12
          
          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate using legacy format for compatibility
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db
          
          # Cleanup
          rm $RUNNER_TEMP/certificate.p12

      - name: Build Tauri App
        env:
          # macOS signing
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd crates/gtfs_validator_gui
          cargo tauri build ${{ matrix.args }}

      - name: Notarize macOS app
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Find the DMG file
          DMG_PATH=$(find target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          
          if [ -n "$DMG_PATH" ]; then
            echo "Notarizing $DMG_PATH..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            
            # Staple the notarization ticket
            xcrun stapler staple "$DMG_PATH"
            echo "Notarization complete!"
          else
            echo "No DMG found for notarization"
          fi

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts || echo "No artifacts directory"

      - name: Prepare release artifacts (original + stable names)
        run: |
          mkdir -p release
          
          # Copy original installer filenames (versioned) as-is
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.sig" \) -print0 \
            | while IFS= read -r -d '' file; do
                cp "$file" release/
              done

          copy_first() {
            local pattern="$1"
            local dest="$2"
            local src
            src=$(find artifacts -name "$pattern" -type f | head -1)
            if [ -n "$src" ]; then
              cp "$src" "release/$dest"
            fi
          }

          # Stable names for "latest" links
          copy_first "*.dmg" "gtfs-guru-macos.dmg"
          copy_first "*.msi" "gtfs-guru-windows-x64.msi"
          copy_first "*.exe" "gtfs-guru-windows-x64-setup.exe"
          copy_first "*.deb" "gtfs-guru-linux-amd64.deb"
          copy_first "*.AppImage" "gtfs-guru-linux-amd64.AppImage"
          copy_first "*.rpm" "gtfs-guru-linux-x86_64.rpm"
          copy_first "*.app.tar.gz" "gtfs-guru-macos-universal.app.tar.gz"
          copy_first "*.app.tar.gz.sig" "gtfs-guru-macos-universal.app.tar.gz.sig"
          copy_first "*.msi.sig" "gtfs-guru-windows-x64.msi.sig"
          copy_first "*.exe.sig" "gtfs-guru-windows-x64-setup.exe.sig"
          copy_first "*.AppImage.sig" "gtfs-guru-linux-amd64.AppImage.sig"

          # Versioned CLI copies for reproducibility
          VERSION="${GITHUB_REF_NAME:-unknown}"
          for file in release/gtfs-guru-*.tar.gz release/gtfs-guru-*.zip; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            if [[ "$base" == *.tar.gz ]]; then
              stem="${base%.tar.gz}"
              ext="tar.gz"
            else
              stem="${base%.*}"
              ext="${base##*.}"
            fi
            cp "$file" "release/${stem}-${VERSION}.${ext}"
          done

      - name: Generate updater manifest (latest.json)
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import pathlib
          import urllib.parse
          
          release_dir = pathlib.Path("release")
          tag = os.environ.get("GITHUB_REF_NAME", "unknown")
          version = tag[1:] if tag.startswith("v") else tag
          pub_date = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          base_url = f"https://github.com/abasis-ltd/gtfs.guru/releases/download/{tag}/"
          
          def asset_url(name: str) -> str:
            return base_url + urllib.parse.quote(name)
          
          def add_platform(platforms, key, file_name, sig_name, required=False):
            file_path = release_dir / file_name
            sig_path = release_dir / sig_name
            if file_path.exists() and sig_path.exists():
              platforms[key] = {
                "url": asset_url(file_name),
                "signature": sig_path.read_text().strip(),
              }
              return True
            if required:
              missing = []
              if not file_path.exists():
                missing.append(file_name)
              if not sig_path.exists():
                missing.append(sig_name)
              raise SystemExit(f"Missing updater assets for {key}: {', '.join(missing)}")
            return False
          
          platforms = {}
          add_platform(platforms, "darwin-aarch64", "gtfs-guru-macos-universal.app.tar.gz", "gtfs-guru-macos-universal.app.tar.gz.sig", required=True)
          add_platform(platforms, "darwin-x86_64", "gtfs-guru-macos-universal.app.tar.gz", "gtfs-guru-macos-universal.app.tar.gz.sig", required=True)
          add_platform(platforms, "windows-x86_64", "gtfs-guru-windows-x64.msi", "gtfs-guru-windows-x64.msi.sig", required=True)
          add_platform(platforms, "linux-x86_64", "gtfs-guru-linux-amd64.AppImage", "gtfs-guru-linux-amd64.AppImage.sig", required=False)
          
          data = {
            "version": version,
            "pub_date": pub_date,
            "platforms": platforms,
          }
          
          (release_dir / "latest.json").write_text(json.dumps(data, indent=2))
          print("Generated latest.json with platforms:", ", ".join(platforms.keys()))
          PY

          # Checksums (include latest.json)
          (cd release && sha256sum * > gtfs-guru-SHA256SUMS.txt)

          echo "=== Release files ==="
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates (skip if already published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          publish_or_skip() {
            local name="$1"
            local output
            local status

            set +e
            output=$(cargo publish -p "$name" 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "$output"
            elif echo "$output" | grep -q "already exists"; then
              echo "Skip ${name} ${VERSION} (already published)"
            else
              echo "$output"
              return "$status"
            fi

            # Dependent packages cannot be prepared until the exact version is
            # visible in the crates.io index. Propagation time is variable, so
            # poll with a bounded timeout instead of sleeping a fixed 30s.
            for attempt in $(seq 1 20); do
              if cargo info "${name}@${VERSION}" >/dev/null 2>&1; then
                echo "${name} ${VERSION} is visible in crates.io"
                return 0
              fi
              echo "Waiting for crates.io index (${attempt}/20)..."
              sleep 15
            done
            echo "Timed out waiting for ${name} ${VERSION} in crates.io" >&2
            return 1
          }

          publish_or_skip gtfs-guru-model
          publish_or_skip gtfs-guru-core
          publish_or_skip gtfs-guru-report
          publish_or_skip gtfs-guru
          publish_or_skip gtfs-guru-web

  build-wheels:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64
            manylinux: '2_28'
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64
    runs-on: ${{ matrix.runner }}
    name: Wheel (${{ matrix.runner }} ${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m crates/gtfs_validator_python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/gtfs_validator_python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-python-wheel:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist
      - name: Install the built wheel
        run: "python -m pip install --only-binary=:all: dist/*.whl"
      - name: Exercise the Python API
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: python scripts/test-python-wheel.py

  publish-pypi:
    needs: [build-wheels, build-sdist, test-python-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Check artifacts before upload
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist/
          wheels=$(find dist -name '*.whl' | wc -l)
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          echo "wheels=$wheels sdists=$sdists"
          if [ "$wheels" -lt 5 ] || [ "$sdists" -lt 1 ]; then
            echo "::error::expected >=5 wheels and >=1 sdist, got $wheels/$sdists"
            exit 1
          fi
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "::error::PYPI_API_TOKEN is not set"
            exit 1
          fi

      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Verify the version is live on PyPI
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if curl -sf "https://pypi.org/pypi/gtfs-guru/${VERSION}/json" >/dev/null; then
              echo "gtfs-guru ${VERSION} is live on PyPI."
              exit 0
            fi
            echo "Not visible yet (attempt ${attempt}/6); waiting 20s..."
            sleep 20
          done
          echo "::error::gtfs-guru ${VERSION} never appeared on PyPI after upload"
          exit 1

  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: ./.github/actions/install-wasm-pack
      - name: Build Wasm
        run: |
          set -euo pipefail
          cd crates/gtfs_validator_wasm
          wasm-pack build --target web --release --out-dir pkg
          cp js/worker.js js/index.js pkg/
          cp types/*.d.ts pkg/
          cp package.json.template pkg/package.json
      - name: Publish to NPM
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd crates/gtfs_validator_wasm/pkg
          test "$(node -p 'require("./package.json").name')" = "@abasisltd/gtfs-guru-wasm"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          npm pack --dry-run
          if npm view "@abasisltd/gtfs-guru-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip @abasisltd/gtfs-guru-wasm ${VERSION} (already published)"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-website:
    needs: [publish-crates, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployment configuration
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in HETZNER_HOST HETZNER_KNOWN_HOSTS HETZNER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/install-wasm-pack

      - name: Install binaryen
        env:
          BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
          BINARYEN_VERSION: '131'
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o "$archive"
          echo "$BINARYEN_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build production website assets
        run: ./scripts/build-wasm.sh

      - name: Synchronize website to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_PATH: ${{ secrets.HETZNER_PATH }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          install -m 600 /dev/null "$RUNNER_TEMP/hetzner_deploy_key"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$RUNNER_TEMP/hetzner_deploy_key"
          trap 'rm -f "$RUNNER_TEMP/hetzner_deploy_key"' EXIT

          DEPLOY_USER="${HETZNER_USER:-botuser}"
          DEPLOY_PATH="${HETZNER_PATH:-gtfs-guru-web/}"
          rsync -az --delete-delay --delete-excluded \
            --exclude Dockerfile \
            --exclude nginx.conf \
            -e "ssh -i $RUNNER_TEMP/hetzner_deploy_key -o IdentitiesOnly=yes" \
            website/ "$DEPLOY_USER@$HETZNER_HOST:$DEPLOY_PATH"

      - name: Verify deployed website version
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://gtfs.guru/pkg/package.json > "$RUNNER_TEMP/package.json"
          DEPLOYED_VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/package.json")
          test "$DEPLOYED_VERSION" = "$EXPECTED_VERSION" || {
            echo "Website reports $DEPLOYED_VERSION, expected $EXPECTED_VERSION" >&2
            exit 1
          }
