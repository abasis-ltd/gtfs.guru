site_name: GTFS.Guru
site_description: High-performance GTFS feed validator written in Rust
site_url: https://abasis-ltd.github.io/gtfs.guru/
repo_url: https://github.com/abasis-ltd/gtfs.guru
repo_name: abasis-ltd/gtfs.guru

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

# Repo-facing notes: release steps, per-crate agent briefs, the golden suite's
# local instructions, and the spec watcher's maintenance protocol. They stay in
# the repo and out of the site.
exclude_docs: |
  MAINTENANCE.md
  golden.md
  spec-watch.md
  agents/

nav:
  - Home: index.md
  - Installation: installation.md
  - System Dependencies: system-dependencies.md
  - Usage: usage.md
  - LLM Guide: llm.md
  - Python API: python_api.md
  - Validation Rules: rules.md
  - Browser (WASM): wasm.md
